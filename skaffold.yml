# yaml-language-server: $schema=https://raw.githubusercontent.com/GoogleContainerTools/skaffold/main/docs-v2/content/en/schemas/v4beta13.json
apiVersion: skaffold/v4beta13
kind: Config

build:
  tagPolicy:
    sha256: {}
  artifacts:
    - image: auth
      context: auth
      sync:
        infer:
          - "src/**"
      docker:
        dockerfile: dockerfile
    - image: sandbox
      context: Sandbox/service
      sync:
        infer:
          - "src/**"
      docker:
        dockerfile: dockerfile
    - image: router
      context: Sandbox/router
      sync:
        infer:
          - "src/**"
      docker:
        dockerfile: dockerfile
    - image: agent
      context: Sandbox/agent
      sync:
        infer:
          - "src/**"
      docker:
        dockerfile: dockerfile
    - image: template
      context: Sandbox/template
      docker:
        dockerfile: dockerfile
    - image: ai-worker
      context: ai-worker
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"

manifests:
  rawYaml:
    - k8s/ingress.yml
    - k8s/sandbox-deployment.yml
    - k8s/sandbox-service.yml
    - k8s/secrets.yml
    - k8s/router-deployment.yml
    - k8s/router-service.yml
    - k8s/rbac.yml
    - k8s/ai-worker-deployment.yml
    - k8s/ai-worker-service.yml
    - k8s/auth-deployment.yml
    - k8s/auth-service.yml
